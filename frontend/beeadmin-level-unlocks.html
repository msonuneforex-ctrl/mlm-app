<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Level Unlock Requests - Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="main-content">
    <div class="page-header">
      <h1>Level Unlock Requests</h1>
      <p>Review on-chain deposit requests for level income unlocks. No 5% fee applies — $20 per level.</p>
    </div>

    <div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-primary tab-filter active" data-status="pending"   onclick="setStatus('pending')">Pending</button>
        <button class="btn-primary tab-filter" style="background:rgba(0,200,120,0.15);color:var(--success);border-color:var(--success)" data-status="approved" onclick="setStatus('approved')">Approved</button>
        <button class="btn-primary tab-filter" style="background:rgba(255,80,80,0.12);color:#ff6060;border-color:#ff6060" data-status="rejected" onclick="setStatus('rejected')">Rejected</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>User</th>
            <th>Level</th>
            <th>Amount</th>
            <th>Network</th>
            <th>Tx Hash</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="8">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Reject modal -->
<div class="modal-overlay" id="rejectModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:26px 22px;max-width:380px;width:100%;position:relative">
    <button style="position:absolute;top:12px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer" onclick="closeRejectModal()">×</button>
    <h3>Reject Request</h3>
    <p style="color:var(--muted);font-size:13px">Optionally provide a reason for rejection.</p>
    <label>Remarks (optional)</label>
    <input type="text" id="rejectRemarks" placeholder="e.g. Invalid transaction hash" style="margin-bottom:14px" />
    <button class="btn-primary" style="background:rgba(255,80,80,0.15);color:#ff6060;border:1.5px solid #ff6060" onclick="confirmReject()">Confirm Reject</button>
    <div id="rejectMsg" class="msg" style="margin-top:10px"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
requireAdmin();
renderSidebar('level-unlocks', 'admin');

let currentStatus = 'pending';
let rejectId = null;

function setStatus(s) {
  currentStatus = s;
  document.querySelectorAll('.tab-filter').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-status="${s}"]`).classList.add('active');
  loadTable();
}

async function loadTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted)">Loading...</td></tr>';
  try {
    const rows = await apiRequest(`/admin/level-unlock-deposits?status=${currentStatus}`);
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="color:var(--muted)">No ${currentStatus} requests</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const hash = r.txn_ref
        ? `<span title="${escapeHtml(r.txn_ref)}" style="cursor:help">${escapeHtml(r.txn_ref.substring(0,14))}…</span>`
        : '-';
      const actions = r.status === 'pending'
        ? `<button class="btn-primary" style="padding:5px 12px;font-size:12px" onclick="approve(${r.id})">Approve</button>
           <button class="btn-primary" style="padding:5px 12px;font-size:12px;background:rgba(255,80,80,0.12);color:#ff6060;border-color:#ff6060;margin-left:6px" onclick="openReject(${r.id})">Reject</button>`
        : `<span style="color:var(--muted);font-size:12px">${r.remarks || '—'}</span>`;
      const statusBadge = r.status === 'approved'
        ? `<span style="color:var(--success);font-weight:600">✓ Approved</span>`
        : r.status === 'rejected'
          ? `<span style="color:#ff6060;font-weight:600">✗ Rejected</span>`
          : `<span style="color:var(--warning);font-weight:600">⏳ Pending</span>`;
      return `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td><strong>${escapeHtml(r.user_code)}</strong><br><span style="font-size:12px;color:var(--muted)">${escapeHtml(r.name)}</span></td>
        <td><strong>Level ${r.level}</strong></td>
        <td>${usdt(r.amount)}</td>
        <td>${r.network || '-'}</td>
        <td>${hash}</td>
        <td>${statusBadge}</td>
        <td>${actions}</td>
      </tr>`;
    }).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="8" style="color:var(--warning)">${escapeHtml(err.message)}</td></tr>`;
  }
}

async function approve(id) {
  if (!confirm('Approve this level unlock deposit?')) return;
  try {
    const res = await apiRequest(`/admin/level-unlock-deposits/${id}/approve`, 'PUT');
    toast(res.message || 'Approved');
    loadTable();
  } catch (err) {
    toast(err.message, 'error');
  }
}

function openReject(id) {
  rejectId = id;
  document.getElementById('rejectRemarks').value = '';
  document.getElementById('rejectMsg').textContent = '';
  document.getElementById('rejectModal').style.display = 'flex';
}

function closeRejectModal() {
  document.getElementById('rejectModal').style.display = 'none';
}

async function confirmReject() {
  const remarks = document.getElementById('rejectRemarks').value.trim();
  try {
    const res = await apiRequest(`/admin/level-unlock-deposits/${rejectId}/reject`, 'PUT', { remarks });
    toast(res.message || 'Rejected');
    closeRejectModal();
    loadTable();
  } catch (err) {
    document.getElementById('rejectMsg').className = 'msg error';
    document.getElementById('rejectMsg').textContent = err.message;
  }
}

loadTable();
</script>
</body>
</html>
