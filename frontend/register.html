<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register - Bee AI Verse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .placement-info {
    background: rgba(255, 201, 60, 0.08);
    border: 1px solid rgba(255, 201, 60, 0.25);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
    display: none;
  }
  .placement-info.visible { display: block; }
  .placement-info .pi-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .placement-info .pi-row:last-child { margin-bottom: 0; }
  .placement-info .pi-label {
    color: var(--muted);
    min-width: 80px;
  }
  .placement-info .pi-val {
    color: #ffc93c;
    font-weight: 600;
  }
  .placement-info .pi-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .placement-info .pi-badge.left  { background: rgba(255,201,60,0.15); color: #ffc93c; }
  .placement-info .pi-badge.right { background: rgba(255,167,111,0.15); color: #ffa76f; }
  .placement-info .pi-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .placement-error {
    font-size: 12.5px;
    color: #ff6f6f;
    margin-top: -10px;
    margin-bottom: 14px;
    display: none;
  }
  .placement-error.visible { display: block; }
</style>
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-shell">
    <div class="auth-eyebrow"><span class="pulse-dot"></span> Join The Hive Network</div>

    <div class="auth-bot">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="12" cy="13.5" rx="5.5" ry="6.5" stroke="#ffc93c" stroke-width="1.5"/>
        <path d="M6.8 11h10.4M6.5 14h11M7.2 17h9.6" stroke="#ffc93c" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="5.2" r="2.4" stroke="#ffc93c" stroke-width="1.5"/>
        <path d="M10.3 3.2 9 1.6M13.7 3.2 15 1.6" stroke="#ffc93c" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M5.5 10c-2.4-1.4-3.6-.2-3.6 1.6 0 1.8 2 2.4 3.6.9" stroke="#ffc93c" stroke-width="1.2" opacity="0.7"/>
        <path d="M18.5 10c2.4-1.4 3.6-.2 3.6 1.6 0 1.8-2 2.4-3.6.9" stroke="#ffc93c" stroke-width="1.2" opacity="0.7"/>
      </svg>
    </div>

    <div class="auth-border-glow">
      <div class="auth-box">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Set up your Bee AI Verse ID in seconds</p>
        <form id="registerForm">
          <label>Full Name</label>
          <input type="text" id="name" required placeholder="Your full name" />

          <label>Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />

          <label>Phone</label>
          <input type="text" id="phone" placeholder="Optional" />

          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters" />

          <label>Sponsor ID</label>
          <input type="text" id="sponsorCode" required placeholder="e.g. BAV01 - ID of the person who referred you" style="text-transform:uppercase" autocomplete="off" />
          <div class="placement-error" id="sponsorError"></div>

          <label>Preferred Leg</label>
          <select id="side">
            <option value="">Auto-place (first available)</option>
            <option value="L">Left</option>
            <option value="R">Right</option>
          </select>
          <div id="sideLockNote" style="font-size:12.5px;color:var(--muted);display:none;margin-top:-8px;margin-bottom:14px"></div>

          <!-- Placement preview card -->
          <div class="placement-info" id="placementInfo">
            <div class="pi-title">📍 You will be placed under</div>
            <div class="pi-row">
              <span class="pi-label">Parent ID</span>
              <span class="pi-val" id="piParentCode"></span>
            </div>
            <div class="pi-row">
              <span class="pi-label">Name</span>
              <span class="pi-val" id="piParentName"></span>
            </div>
            <div class="pi-row">
              <span class="pi-label">Position</span>
              <span id="piPositionBadge" class="pi-badge"></span>
            </div>
            <div class="pi-row" id="piSponsorRow" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,201,60,0.1)">
              <span class="pi-label" style="color:var(--muted);font-size:11.5px">Sponsor</span>
              <span style="color:var(--muted);font-size:11.5px" id="piSponsor"></span>
            </div>
          </div>

          <button type="submit" class="btn-primary">Register</button>
        </form>
        <div id="msg" class="msg"></div>
        <div class="switch-link">Already have an account? <a href="login.html">Login</a></div>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
// ── URL params (referral links like register.html?sponsor=BAV01&side=L) ──
const params = new URLSearchParams(window.location.search);
const sponsorFromLink = params.get('sponsor');
const sideFromLink    = params.get('side');

if (sponsorFromLink) {
  document.getElementById('sponsorCode').value = sponsorFromLink.toUpperCase();
}
if (sideFromLink === 'L' || sideFromLink === 'R') {
  const sideSelect = document.getElementById('side');
  sideSelect.value    = sideFromLink;
  sideSelect.disabled = true;
  const note = document.getElementById('sideLockNote');
  note.style.display = 'block';
  note.textContent = `You're joining via a ${sideFromLink === 'L' ? 'Left' : 'Right'} leg referral link.`;
}

// ── Placement preview ──
let previewTimer = null;

function updatePlacementPreview() {
  const code = document.getElementById('sponsorCode').value.trim().toUpperCase();
  const side = document.getElementById('side').value;
  const infoBox = document.getElementById('placementInfo');
  const errBox  = document.getElementById('sponsorError');

  if (!code || code.length < 3) {
    infoBox.classList.remove('visible');
    errBox.classList.remove('visible');
    return;
  }

  fetch(`/auth/placement-preview?sponsorCode=${encodeURIComponent(code)}&side=${side}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        infoBox.classList.remove('visible');
        errBox.textContent = data.error;
        errBox.classList.add('visible');
        return;
      }
      errBox.classList.remove('visible');

      document.getElementById('piParentCode').textContent = data.parentCode;
      document.getElementById('piParentName').textContent = data.parentName;

      const badge = document.getElementById('piPositionBadge');
      badge.textContent   = data.position === 'L' ? 'Left Leg' : 'Right Leg';
      badge.className     = 'pi-badge ' + (data.position === 'L' ? 'left' : 'right');

      // Show sponsor row only when parent differs from sponsor (BFS placed deeper)
      const sponsorRow = document.getElementById('piSponsorRow');
      if (data.parentCode !== data.sponsorCode) {
        document.getElementById('piSponsor').textContent = `${data.sponsorCode} – ${data.sponsorName}`;
        sponsorRow.style.display = 'flex';
      } else {
        sponsorRow.style.display = 'none';
      }

      infoBox.classList.add('visible');
    })
    .catch(() => {
      infoBox.classList.remove('visible');
    });
}

// Debounce: wait 500 ms after user stops typing/changing
document.getElementById('sponsorCode').addEventListener('input', () => {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePlacementPreview, 500);
});
document.getElementById('side').addEventListener('change', updatePlacementPreview);

// If sponsor was pre-filled from URL, trigger preview immediately
if (sponsorFromLink) {
  updatePlacementPreview();
}

// ── Registration submit ──
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  msg.className = 'msg';

  const payload = {
    name:        document.getElementById('name').value,
    email:       document.getElementById('email').value,
    phone:       document.getElementById('phone').value,
    password:    document.getElementById('password').value,
    sponsorCode: document.getElementById('sponsorCode').value.trim().toUpperCase(),
    side:        document.getElementById('side').value
  };

  try {
    const data = await apiRequest('/auth/register', 'POST', payload);
    msg.innerHTML = `Registration successful! Your Bee AI Verse ID is <strong>${data.userCode}</strong>. Redirecting to login...`;
    msg.className = 'msg success';
    setTimeout(() => window.location.href = 'login.html', 2000);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
  }
});
</script>
</body>
</html>
