<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>User Transactions - Bee AI Verse Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>

  <div class="main-content">
    <div class="page-header">
      <a href="beeadmin-users.html" style="color:var(--ice);text-decoration:none;font-size:13px">&larr; Back to Users</a>
      <h1 style="margin-top:8px">User Transactions</h1>
      <p>Every deposit, withdrawal, referral bonus, and fee tied to this User ID, with a running wallet balance.</p>
    </div>

    <div class="panel" id="userSummary">Loading user...</div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:6px">
        <h3 style="margin:0">Transaction Ledger</h3>
        <div class="net-toggle" style="width:auto;margin:0" id="filterToggle">
          <div class="net-pill active" data-filter="all">All</div>
          <div class="net-pill" data-filter="deposit">Deposits</div>
          <div class="net-pill" data-filter="withdrawal">Withdrawals</div>
          <div class="net-pill" data-filter="bonus">Bonuses &amp; Fees</div>
        </div>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Detail</th><th>Amount</th><th>Status</th><th>Running Balance</th></tr></thead>
        <tbody id="historyBody"><tr><td colspan="6">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script>
requireAdmin();
renderSidebar('users', 'admin');

const userId = new URLSearchParams(window.location.search).get('id');
let allRows = [];

const TYPE_LABELS = {
  deposit: 'Deposit',
  withdrawal: 'Withdrawal',
  deposit_credit: 'Deposit Credit',
  referral_bonus: 'Referral Bonus',
  platform_fee: 'Platform Fee',
  admin_withdrawal: 'Admin Withdrawal',
  capped_forfeit: 'Earning Cap Reached'
};

function bucket(kind) {
  if (kind === 'deposit') return 'deposit';
  if (kind === 'withdrawal') return 'withdrawal';
  return 'bonus';
}

function renderRows(rows) {
  const tbody = document.getElementById('historyBody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="6">No transactions yet</td></tr>'; return; }

  tbody.innerHTML = rows.map(r => {
    const label = TYPE_LABELS[r.kind] || r.kind;
    const sign = r.delta > 0 ? '+' : (r.delta < 0 ? '' : '');
    const amtClass = r.delta > 0 ? 'amount-pos' : (r.delta < 0 ? 'amount-neg' : '');
    return `
      <tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td><span class="badge ${r.kind}">${label}</span></td>
        <td style="font-size:12.5px;color:var(--text-dim)">${r.network ? r.network + ' &middot; ' : ''}${r.ref || '-'}</td>
        <td class="${amtClass}">${sign}${usdt(Math.abs(r.delta))}</td>
        <td><span class="badge ${r.status}">${r.status}</span></td>
        <td>${usdt(r.running_balance)}</td>
      </tr>
    `;
  }).join('');
  replayMotion('#historyBody');
}

document.getElementById('filterToggle').addEventListener('click', (e) => {
  const pill = e.target.closest('.net-pill');
  if (!pill) return;
  document.querySelectorAll('#filterToggle .net-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  const f = pill.dataset.filter;
  renderRows(f === 'all' ? allRows : allRows.filter(r => bucket(r.kind) === f));
});

async function load() {
  if (!userId) {
    document.getElementById('userSummary').textContent = 'No user selected.';
    return;
  }
  try {
    const data = await apiRequest(`/admin/users/${userId}/transactions`);
    const u = data.user;
    document.getElementById('userSummary').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
        <div>
          <div style="font-size:12.5px;color:var(--muted)">User ID</div>
          <div style="font-size:22px;font-weight:800;color:var(--ice)">${u.user_code}</div>
          <div style="color:#fff;font-weight:600;margin-top:4px">${u.name}</div>
          <div style="color:var(--text-dim);font-size:13px">${u.email}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12.5px;color:var(--muted)">Current Wallet Balance</div>
          <div class="counter" id="currentBalance" style="font-size:24px;font-weight:800;color:var(--ice)" data-raw="0">0.00 USDT</div>
          <span class="badge ${u.status === 'active' ? 'approved' : 'rejected'}" style="margin-top:6px;display:inline-block">${u.status}</span>
        </div>
      </div>
      ${data.cap ? `
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <div style="font-size:12.5px;color:var(--muted)">Earning Cap</div>
          <div style="font-size:15px;color:#fff">${usdt(data.cap.used)} / ${usdt(data.cap.ceiling)} earned <span style="color:var(--text-dim);font-size:12.5px">(net invested: ${usdt(data.cap.netInvestedCapital)})</span></div>
        </div>
        ${data.cap.isCapped
          ? `<span class="gen-status inactive">Capped — needs redeposit</span>`
          : `<span style="color:var(--text-dim);font-size:13px">${usdt(data.cap.headroom)} headroom remaining</span>`
        }
      </div>` : ''}
    `;
    allRows = data.transactions;
    renderRows(allRows);
    animateCounter(document.getElementById('currentBalance'), u.wallet_balance, (n) => usdt(n));
  } catch (err) {
    document.getElementById('userSummary').textContent = err.message || 'Unable to load user';
    document.getElementById('historyBody').innerHTML = `<tr><td colspan="6">Unable to load history</td></tr>`;
  }
}
load();
</script>
</body>
</html>
